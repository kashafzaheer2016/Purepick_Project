[pytest]
DJANGO_SETTINGS_MODULE = purepick_core.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
    --no-header
markers =
    unit: Pure unit tests (no DB, no network)
    integration: Tests that hit the DB or real services
    api: Tests that use Django test client against endpoints
    slow: Tests that are slow (OCR, ML inference)
